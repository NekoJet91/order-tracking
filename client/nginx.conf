server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app, the API and the socket all come from this one origin, mirroring what the Vite
    # dev proxy does in development. CORS therefore never enters the picture.

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://api:8080;

        # Required for the handshake. nginx talks HTTP/1.0 upstream by default, which has no
        # Upgrade mechanism, and the two headers are hop-by-hop so they are not forwarded on
        # their own. Without all three the handshake returns a plain 200.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Long enough that the application's own heartbeat, not this timeout, is what notices
        # a dead peer.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Hashed filenames, so the content behind a URL can never change. Caching them for a year
    # is safe by construction, and it is what makes a repeat visit fetch one small document.
    # Filenames are content-hashed, so a year is safe by construction. One directive only:
    # adding `expires` as well would emit a second, conflicting Cache-Control header.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The one file that must never be cached: it points at the hashed assets, so a stale copy
    # pins a browser to a deployment that is gone.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: /orders/ORD-00000001 is a React route, not a file, so a hard
    # refresh there has to return the app and let the router read the path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
